apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage

data:
  settings.yaml: |
    title: Homelab

    layout:
      Infrastructure:
        style: row
        columns: 3
      Services:
        style: row
        columns: 3

  services.yaml: |
    - Infrastructure:
        - Kubernetes:
            icon: kubernetes.png
            description: Kubernetes Cluster

        - Pi-hole:
            icon: pi-hole.png
            href: http://pihole.home.arpa
            description: DNS & Network Ad Blocking
            widget:
              type: pihole
              url: http://pihole.home.arpa
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

        - Traefik:
            icon: traefik.png
            href: http://traefik.home.arpa
            description: Reverse Proxy
            widget:
              type: traefik
              url: http://traefik.home.arpa

    - Services:
        - Plex:
            icon: plex.png
            href: http://plex.home.arpa
            description: Media Server

        - Home Assistant:
            icon: home-assistant.png
            href: http://ha.home.arpa
            description: Home Automation

  kubernetes.yaml: |
    mode: cluster

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Homelab"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hour12: true

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  proxmox.yaml: |
    {}

  custom.css: ""

  custom.js: ""
